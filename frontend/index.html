<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Upload a Shapefile or KML and get areas and lengths in metres, computed in the right projection for every feature."
    />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- __PUBLIC_URL__ is replaced with the site's absolute origin by the server that serves this page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Geo Measure" />
    <meta property="og:title" content="Geo Measure · Measure every site. Precisely." />
    <meta
      property="og:description"
      content="Upload a Shapefile or KML and get areas and lengths in metres, computed in the right projection for every feature."
    />
    <meta property="og:url" content="__PUBLIC_URL__/" />
    <meta property="og:image" content="__PUBLIC_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Geo Measure logo and the tagline Measure every site. Precisely." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__PUBLIC_URL__/og-image.png" />
    <title>Geo Measure · Measure every site. Precisely.</title>
    <script>
      // Apply the theme before first paint (no flash). Must match src/lib/theme.ts.
      ;(function () {
        var preference = 'dark'
        try {
          preference = localStorage.getItem('geo-theme') || 'dark'
        } catch (e) {}
        var dark =
          preference !== 'light' &&
          (preference !== 'system' || window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
