name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/openapi.json"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/openapi.json"
      - ".github/workflows/frontend.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    name: Lint, typecheck, test & build (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: API types match the committed OpenAPI snapshot
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test with coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000
      - name: Dev-only UI gallery is absent from the production bundle
        run: "! grep -rq 'UI gallery' dist"
