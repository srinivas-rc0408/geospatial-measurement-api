name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Lint & test, SQLite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest --cov --cov-report=term-missing
        env:
          COVERAGE_FILE: .coverage.sqlite
      - name: Keep coverage data
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-sqlite
          path: backend/.coverage.sqlite
          include-hidden-files: true

  test-postgres:
    name: Test, PostgreSQL 17 (Python 3.12)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: geo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GEO_DATABASE_URL: postgresql+psycopg://postgres:geo@localhost:5432/postgres
      GEO_TEST_DATABASE_URL: postgresql+psycopg://postgres:geo@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Migrations apply and match the models
        run: |
          alembic upgrade head
          alembic check
      - name: Test
        run: pytest --cov --cov-report=term-missing
        env:
          COVERAGE_FILE: .coverage.postgres
      - name: Keep coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-postgres
          path: backend/.coverage.postgres
          include-hidden-files: true

  coverage:
    name: Coverage (SQLite + PostgreSQL)
    needs: [test, test-postgres]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install coverage==7.16.2
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: backend
          merge-multiple: true
      - name: Combine and report
        run: |
          coverage combine .coverage.sqlite .coverage.postgres
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          coverage report

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (no push)
        run: docker build --tag geo-measure-api:ci .
